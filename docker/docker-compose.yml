version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: interlude-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: interlude
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: interlude-redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: interlude-backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: mongodb://mongodb:27017/interlude
      REDIS_URL: redis://redis:6379
      STREAMING_PROVIDER: internet_archive
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      - mongodb
      - redis

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: interlude-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      NEXT_PUBLIC_SOCKET_URL: http://localhost:4000
    depends_on:
      - backend

volumes:
  mongodb_data:
